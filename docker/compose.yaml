services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ventia
      POSTGRES_PASSWORD: ventia
      POSTGRES_DB: ventia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  caddy:
    image: caddy:2-alpine
    ports: ["80:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ventia
      MINIO_ROOT_PASSWORD: ventia-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ventia ventia-secret; do sleep 1; done;
      mc mb --ignore-existing local/ventia;
      mc anonymous set download local/ventia;
      exit 0"
volumes:
  pgdata:
  miniodata:
